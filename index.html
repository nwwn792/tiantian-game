<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>甜甜消消乐 2.0版 · 超级可爱小游戏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cpath d='M50 88C20 66 8 44 22 28c10-11 26-9 28 6 2-15 18-17 28-6 14 16 2 38-28 60z' fill='%23ff6ba9'/%3E%3Ccircle cx='40' cy='44' r='3.2' fill='%235a3a4a'/%3E%3Ccircle cx='60' cy='44' r='3.2' fill='%235a3a4a'/%3E%3Cpath d='M44 52q6 5 12 0' stroke='%235a3a4a' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://miaoda.feishu.cn">
<link href="https://miaoda.feishu.cn/fonts/css2?family=ZCOOL+KuaiLe&family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   甜甜消消乐 · 软萌 kawaii 主题
   色板：草莓粉 #ff6ba9 / 蜜桃橙 #ff9e63 / 柠檬黄 #ffd23f
        薄荷绿 #7edbc0 / 葡萄紫 #b39bff / 奶油白 #fff7ec
   ============================================================ */
:root{
  --pink:#ff6ba9; --pink-deep:#e34a87; --pink-soft:#ffe4f0;
  --peach:#ff9e63; --lemon:#ffd23f; --mint:#7edbc0;
  --grape:#b39bff; --berry:#ff5c72; --cream:#fff7ec;
  --ink:#6b4a5e; --ink-soft:#a0849a;
  --font-title:'ZCOOL KuaiLe','Microsoft YaHei','PingFang SC','Hiragino Sans GB',sans-serif;
  --font-num:'Baloo 2','ZCOOL KuaiLe','Microsoft YaHei','PingFang SC',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--font-title);
  color:var(--ink);
  background:linear-gradient(170deg,#fff0f6 0%,#f6efff 46%,#eaf8ff 100%);
  min-height:100vh;
  overflow-x:hidden;
  position:relative;
  display:flex;align-items:center;justify-content:center;
  padding:14px 10px;
}
/* ---------- 背景漂浮装饰：云朵 / 星星 / 爱心 ---------- */
.bg-decor{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg-decor .cloud{
  position:absolute;background:#fff;border-radius:999px;opacity:.75;
  filter:blur(1px);
  box-shadow:0 0 0 rgba(255,255,255,0);
}
.bg-decor .cloud::before,.bg-decor .cloud::after{
  content:'';position:absolute;background:#fff;border-radius:50%;
}
.bg-decor .cloud::before{width:55%;height:160%;top:-60%;left:18%}
.bg-decor .cloud::after{width:45%;height:130%;top:-45%;right:12%}
.cloud.c1{width:110px;height:34px;top:8%;left:-40px;animation:drift 34s linear infinite}
.cloud.c2{width:150px;height:44px;top:16%;right:-50px;opacity:.6;animation:drift 46s linear infinite reverse}
.cloud.c3{width:90px;height:28px;top:72%;left:-30px;opacity:.5;animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 160px))}}
.bg-decor .tw{
  position:absolute;font-size:0;animation:twinkle 3.2s ease-in-out infinite;
}
.bg-decor .tw svg{width:22px;height:22px;opacity:.55}
.bg-decor .tw2{animation-delay:1.1s}.bg-decor .tw3{animation-delay:2s}
@keyframes twinkle{0%,100%{transform:scale(.7) rotate(0);opacity:.4}50%{transform:scale(1.15) rotate(18deg);opacity:.9}}

/* ---------- 游戏外壳 ---------- */
.game-shell{
  position:relative;z-index:2;width:min(94vw,460px);
  display:flex;flex-direction:column;gap:12px;align-items:center;
}
/* 标题行 */
.title-row{display:flex;align-items:center;gap:10px;justify-content:center;width:100%}
.title-row .bow-icon{width:34px;height:34px;animation:bowSway 3s ease-in-out infinite;transform-origin:50% 20%}
@keyframes bowSway{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
h1.title{
  font-size:clamp(28px,6vw,38px);color:var(--pink-deep);
  letter-spacing:2px;line-height:1.15;text-shadow:0 2px 0 #fff,0 5px 12px rgba(255,107,169,.25);
  animation:titleBob 3.4s ease-in-out infinite;
}
@keyframes titleBob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-4px) rotate(1.5deg)}}
.level-badge{
  background:linear-gradient(135deg,#ffd23f,#ffb13d);color:#fff;
  font-size:13px;padding:4px 12px;border-radius:999px;
  box-shadow:0 3px 0 #e89a2e,0 6px 12px rgba(255,177,61,.35);
  white-space:nowrap;animation:badgePop 4s ease-in-out infinite;
}
@keyframes badgePop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
/* 统计栏 */
.stats-bar{
  width:100%;display:grid;grid-template-columns:1fr 1fr 1fr 1fr auto;gap:6px;
}
.stat-card{
  background:#fff;border-radius:16px;padding:7px 6px 8px;text-align:center;
  box-shadow:0 4px 10px rgba(255,107,169,.14),inset 0 0 0 2px #ffe9f3;
}
.stat-card .k{font-size:12px;color:var(--ink-soft);letter-spacing:1px}
.stat-card .v{font-family:var(--font-num);font-weight:800;font-size:22px;line-height:1.1}
.stat-card.score .v{color:var(--pink-deep)}
.stat-card.moves .v{color:var(--berry)}
.stat-card.goal .v{color:var(--peach)}
.icon-btn{
  align-self:center;background:#fff;border:none;border-radius:50%;
  width:44px;height:44px;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 10px rgba(255,107,169,.18);transition:transform .15s;
}
.icon-btn:hover{transform:scale(1.08)}
.icon-btn:active{transform:scale(.92)}
.icon-btn svg{width:22px;height:22px}
/* 目标进度条 */
.progress-wrap{width:100%;position:relative}
.progress-track{
  height:16px;background:#fff;border-radius:999px;overflow:hidden;
  box-shadow:inset 0 0 0 2px #ffe9f3,0 3px 8px rgba(255,107,169,.12);
}
.progress-fill{
  height:100%;width:0%;border-radius:999px;
  background:linear-gradient(90deg,#ff8fc8,#ff6ba9,#ff9e63);
  transition:width .5s cubic-bezier(.3,1.3,.5,1);position:relative;
}
.progress-fill::after{
  content:'';position:absolute;inset:0;border-radius:999px;
  background:linear-gradient(90deg,rgba(255,255,255,.45),transparent 40%);
}
.progress-star{
  position:absolute;top:-12px;font-size:0;transition:left .5s cubic-bezier(.3,1.3,.5,1);
}
.progress-star svg{width:26px;height:26px;filter:drop-shadow(0 2px 3px rgba(255,180,60,.5))}
/* 连击指示 */
.combo-badge{
  display:none;align-items:center;gap:5px;margin-top:8px;
  background:linear-gradient(135deg,#ff8fc8,#ff6ba9);color:#fff;
  border-radius:999px;padding:5px 14px;font-size:14px;
  box-shadow:0 4px 10px rgba(255,107,169,.4);
  animation:comboIn .35s cubic-bezier(.34,1.56,.64,1);
}
.combo-badge.show{display:inline-flex}
.combo-badge .heart{width:16px;height:16px}
@keyframes comboIn{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
/* ---------- 棋盘 ---------- */
.board-wrap{
  position:relative;width:min(94vw,440px);aspect-ratio:1;
  background:#fff;border-radius:26px;padding:9px;
  box-shadow:0 10px 26px rgba(255,107,169,.18),0 0 0 4px #fff,0 0 0 6px #ffd9e8;
}
#board{position:relative;width:100%;height:100%;border-radius:20px;overflow:hidden;background:linear-gradient(180deg,#fff5fa,#fff)}
#board .cell-mask{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(45deg,rgba(255,143,200,.07) 25%,transparent 25%,transparent 75%,rgba(255,143,200,.07) 75%),
             linear-gradient(45deg,rgba(255,143,200,.07) 25%,transparent 25%,transparent 75%,rgba(255,143,200,.07) 75%);
  background-size:calc(var(--cell,50px)*2) calc(var(--cell,50px)*2);
  background-position:0 0,calc(var(--cell,50px)) calc(var(--cell,50px));
  border-radius:20px;
}
/* 方块贴纸 */
.piece{
  position:absolute;top:0;left:0;will-change:transform;
  cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:none;
}
.piece .sticker{
  position:absolute;inset:4%;background:#fff;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 3px 7px rgba(255,107,169,.22),inset 0 -4px 8px rgba(255,143,200,.10);
}
.piece svg{width:88%;height:88%;display:block}
.piece.anim{transition:transform .24s cubic-bezier(.3,1.25,.5,1)}
.piece.anim-swap{transition:transform .16s ease}
.piece .sticker{transition:transform .15s ease}
.piece:hover .sticker{transform:scale(1.06) rotate(-3deg)}
.piece.selected .sticker{
  transform:scale(1.14);box-shadow:0 0 0 3px #ffd23f,0 4px 10px rgba(255,180,60,.5);
  animation:selBob .5s ease-in-out infinite;
}
@keyframes selBob{0%,100%{transform:scale(1.14) translateY(0)}50%{transform:scale(1.14) translateY(-4px)}}
.piece.hint .sticker{animation:hintFlash .6s ease-in-out infinite}
@keyframes hintFlash{0%,100%{transform:scale(1);box-shadow:0 3px 7px rgba(255,107,169,.22)}50%{transform:scale(1.18) rotate(8deg);box-shadow:0 0 0 4px #ffd23f,0 4px 12px rgba(255,180,60,.6)}}
.piece.popping .sticker{
  animation:popOut .3s forwards;
}
@keyframes popOut{
  0%{transform:scale(1);opacity:1}
  45%{transform:scale(1.3) rotate(10deg);opacity:1}
  100%{transform:scale(0);opacity:0}
}
/* ---------- 特效层 ---------- */
#fx-layer{position:absolute;inset:0;pointer-events:none;z-index:5}
.fx{position:absolute;font-size:0;animation:burst .65s ease-out forwards}
.fx svg{width:22px;height:22px}
@keyframes burst{
  0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}
  100%{transform:translate(var(--dx,0px),var(--dy,-60px)) scale(1.1) rotate(var(--rot,90deg));opacity:0}
}
.float-score{
  position:absolute;font-family:var(--font-num);font-weight:800;font-size:20px;
  color:var(--pink-deep);text-shadow:0 1px 0 #fff,0 2px 6px rgba(255,107,169,.3);
  animation:floatUp 1s ease-out forwards;pointer-events:none;
}
@keyframes floatUp{0%{transform:translate(-50%,0) scale(.7);opacity:0}20%{opacity:1}100%{transform:translate(-50%,-70px) scale(1.15);opacity:0}}
.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:translate(0,0)}25%{transform:translate(-3px,2px)}50%{transform:translate(3px,-2px)}75%{transform:translate(-2px,-2px)}}
/* ---------- 蛋小黄蹦出来 ---------- */
#egg-pop{
  position:absolute;inset:0;pointer-events:none;z-index:8;display:none;
}
#egg-pop.show{display:block}
.egg-badge{
  position:absolute;width:86px;height:86px;border-radius:50%;
  background:#fff;padding:4px;
  box-shadow:0 6px 18px rgba(255,107,169,.35),0 0 0 3px #ffe9f3;
  animation:eggIn .5s cubic-bezier(.34,1.56,.64,1),eggWobble 1.2s ease-in-out .5s infinite;
}
.egg-badge img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
@keyframes eggIn{
  0%{transform:translateY(-80%) scale(.3) rotate(-12deg);opacity:0}
  100%{transform:translateY(0) scale(1) rotate(0);opacity:1}
}
@keyframes eggWobble{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
.egg-bubble{
  position:absolute;background:#fff;border-radius:18px;padding:8px 14px;
  font-size:18px;color:var(--pink-deep);white-space:nowrap;
  box-shadow:0 4px 14px rgba(255,107,169,.3),inset 0 0 0 2px #ffe9f3;
  animation:bubbleIn .4s cubic-bezier(.34,1.56,.64,1) .15s backwards;
}
.egg-bubble::before{
  content:'';position:absolute;width:14px;height:14px;background:#fff;
  transform:rotate(45deg);bottom:-7px;left:44%;
  box-shadow:3px 3px 0 -1px #ffe9f3;
}
@keyframes bubbleIn{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.egg-badge .spark{position:absolute;font-size:0;animation:twinkle 1s ease-in-out infinite}
/* ---------- 底部按钮区 ---------- */
.action-bar{width:100%;display:flex;flex-direction:column;gap:8px;align-items:center}
.btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{
  font-family:var(--font-title);border:none;cursor:pointer;font-size:14px;color:#fff;
  padding:8px 13px;border-radius:999px;display:inline-flex;align-items:center;gap:5px;
  min-height:44px;
  transition:transform .15s,box-shadow .15s;letter-spacing:.5px;
}
.btn svg{width:16px;height:16px}
.btn-row{gap:8px}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0) scale(.95)}
.btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
.btn-hint{background:linear-gradient(135deg,#ffd23f,#ffb13d);box-shadow:0 4px 0 #e89a2e,0 6px 12px rgba(255,177,61,.35)}
.btn-shuffle{background:linear-gradient(135deg,#7edbc0,#4fc6a8);box-shadow:0 4px 0 #3aa98b,0 6px 12px rgba(79,198,168,.35)}
.btn-restart{background:linear-gradient(135deg,#b39bff,#9679f0);box-shadow:0 4px 0 #7c5fdd,0 6px 12px rgba(150,121,240,.35)}
.btn-home{background:linear-gradient(135deg,#ff9e63,#ff7a5c);box-shadow:0 4px 0 #e06545,0 6px 12px rgba(255,122,92,.35)}
.btn-levels{background:linear-gradient(135deg,#8fd0ff,#6bb8f0);box-shadow:0 4px 0 #4a97cc,0 6px 12px rgba(107,184,240,.35)}
.btn-vip{background:linear-gradient(135deg,#ffcf4d,#ff9e3d);box-shadow:0 4px 0 #e08a2e,0 6px 12px rgba(255,170,60,.35)}
.btn-vip.vip-on{background:linear-gradient(135deg,#ffe9a8,#ffcf4d);color:#7a4a00;box-shadow:0 4px 0 #d9a83c,0 6px 12px rgba(255,200,80,.3)}
.vip-badge{display:none;margin:12px auto 2px;padding:5px 16px;border-radius:999px;background:linear-gradient(135deg,#ffd700,#ff9e00);color:#7a3d00;font-weight:800;font-size:13px;letter-spacing:2px;box-shadow:0 3px 10px rgba(255,190,0,.45)}
.vip-badge.show{display:inline-block}
.stat-card.time .v{color:#6bb8f0}
.stat-card.time-low .v{color:#ff5a5a;animation:blinkT .7s ease-in-out infinite}
@keyframes blinkT{0%,100%{opacity:1}50%{opacity:.35}}
.star-row{display:flex;justify-content:center;gap:6px;margin:4px 0 2px;min-height:34px}
.star-row .st{width:34px;height:34px;opacity:.22;filter:grayscale(1);transform:scale(.8)}
.star-row .st.on{opacity:1;filter:none;transform:scale(1);animation:starPop .55s cubic-bezier(.34,1.8,.64,1) both}
.star-row .st.on:nth-child(2){animation-delay:.12s}
.star-row .st.on:nth-child(3){animation-delay:.24s}
@keyframes starPop{0%{transform:scale(0) rotate(-40deg)}70%{transform:scale(1.25) rotate(6deg)}100%{transform:scale(1) rotate(0)}}

.btn .b-txt{line-height:1}
.level-card h2{margin-bottom:12px}
.level-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px}
.level-btn{
  font-family:var(--font-title);border:none;cursor:pointer;border-radius:16px;
  padding:10px 2px;background:linear-gradient(135deg,#ffe4f0,#ffd6e8);
  box-shadow:0 3px 0 #f0a8c8,0 5px 10px rgba(255,107,169,.2);
  color:var(--pink-deep);transition:transform .15s;min-height:44px;
}
.level-btn:hover{transform:translateY(-2px)}
.level-btn .lv{font-size:20px;display:block;font-weight:800}
.level-btn .ls{display:flex;justify-content:center;gap:2px;margin:3px 0 1px}
.level-btn .ls svg{width:17px;height:17px;display:block}
.level-btn .lt{font-size:9px;color:var(--ink-soft);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.level-btn.cur{background:linear-gradient(135deg,#ffd23f,#ffb13d);box-shadow:0 3px 0 #e89a2e;color:#fff}
.level-btn.locked{background:#f1e8f0;box-shadow:none;color:#c4b6c0;cursor:not-allowed}
.modal-backdrop.fail-mode .m-btns{flex-direction:column;align-items:stretch;gap:8px}
.modal-backdrop.fail-mode .btn-continue{width:100%}
.modal-backdrop.fail-mode .btn-retry{font-size:13px;padding:6px 18px;min-height:36px;align-self:center;justify-content:center;background:linear-gradient(135deg,#cbb9da,#b39ecb);box-shadow:0 3px 0 #9a85b3,0 5px 10px rgba(150,121,240,.2)}
.btn-continue{background:linear-gradient(135deg,#ffd23f,#ff9e63);box-shadow:0 4px 0 #e88a3e,0 6px 12px rgba(255,158,99,.4);justify-content:center}
.ad-confirm-card{text-align:center;max-width:340px}
.ad-icon{width:64px;height:64px;margin:0 auto 10px}
.ad-icon svg{width:64px;height:64px;filter:drop-shadow(0 4px 8px rgba(255,107,169,.35))}
.btn-ok{background:linear-gradient(135deg,#ff9e63,#ff7a5c);box-shadow:0 4px 0 #e06545,0 6px 12px rgba(255,122,92,.35)}
.btn-cancel{background:linear-gradient(135deg,#d9c9e0,#c4b2cf);box-shadow:0 4px 0 #a695b2,0 6px 12px rgba(196,178,207,.35)}
.ad-player-backdrop{background:rgba(40,20,45,.78)}
.ad-player-card{width:min(92vw,560px);background:#fff;border-radius:24px;padding:16px;text-align:center;box-shadow:0 18px 50px rgba(90,40,80,.4)}
.ad-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.ad-title{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-title);color:var(--pink-deep);font-size:17px;letter-spacing:1px}
.ad-title svg{width:20px;height:20px}
.ad-count{font-family:var(--font-num);font-weight:800;color:var(--peach);font-size:18px}
.ad-frame{position:relative;width:100%;aspect-ratio:16/9;background:#1a1030;border-radius:14px;overflow:hidden;margin-bottom:10px}
.ad-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.ad-loading{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;background:#241038;color:#ffd7f0;font-size:13px;z-index:5}
.ad-loading.show{display:flex}
.ad-loading.fail{cursor:pointer;color:#ffb4d9}
.ad-spinner{width:34px;height:34px;border:4px solid rgba(255,255,255,.2);border-top-color:#ff8fc8;border-radius:50%;animation:adSpin 1s linear infinite}
@keyframes adSpin{to{transform:rotate(360deg)}}
.ad-reload-icon{font-size:30px;font-weight:800;line-height:1}
.ad-bar{height:10px;background:#ffe4ef;border-radius:999px;overflow:hidden;margin:4px 0 12px}
.ad-fill{height:100%;width:0%;background:linear-gradient(90deg,#ffd23f,#ff9e63);border-radius:999px;transition:width 1s linear}
.ad-go:disabled{opacity:.5;cursor:not-allowed}
.ad-go{width:180px;justify-content:center}
.tip-text{font-size:13px;color:var(--ink-soft);text-align:center;line-height:1.6}
/* ---------- 开始遮罩 ---------- */
.overlay{
  position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(170deg,#fff0f6,#f6efff,#eaf8ff);
  flex-direction:column;gap:18px;padding:20px;text-align:center;
  transition:opacity .4s,visibility .4s;
}
.overlay.hide{opacity:0;visibility:hidden;pointer-events:none}
.overlay .big-title{font-size:clamp(34px,8vw,50px);color:var(--pink-deep);text-shadow:0 3px 0 #fff,0 8px 18px rgba(255,107,169,.3);letter-spacing:3px}
.title .ver,.big-title .ver{font-size:.25em;vertical-align:super;letter-spacing:1px;font-weight:800;opacity:.8}
.overlay .sub{font-size:15px;color:var(--ink-soft);line-height:1.8}
.overlay .sub b{color:var(--pink-deep)}
.over-egg{
  width:130px;height:130px;border-radius:50%;background:#fff;padding:6px;
  box-shadow:0 10px 26px rgba(255,107,169,.35),0 0 0 4px #ffe9f3;
  animation:eggBob 2.6s ease-in-out infinite;position:relative;
}
.over-egg img{width:100%;height:100%;border-radius:50%;object-fit:cover;display:block}
@keyframes eggBob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-10px) rotate(4deg)}}
.over-egg .thought{
  position:absolute;top:-34px;right:-30px;background:#fff;border-radius:14px;padding:6px 10px;
  font-size:15px;color:var(--pink-deep);box-shadow:0 4px 10px rgba(255,107,169,.25);
  animation:thoughtPop 2.6s ease-in-out infinite;
}
@keyframes thoughtPop{0%,30%,100%{transform:scale(1) rotate(-4deg)}15%{transform:scale(1.15) rotate(4deg)}}
.btn-play{
  font-size:22px;padding:12px 44px;
  background:linear-gradient(135deg,#ff8fc8,#ff6ba9);box-shadow:0 6px 0 #e34a87,0 10px 22px rgba(255,107,169,.45);
  animation:playPulse 1.8s ease-in-out infinite;
}
@keyframes playPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.overlay .deco-star{position:absolute;font-size:0;animation:twinkle 3s ease-in-out infinite}
/* ---------- 结果弹窗 ---------- */
.modal-backdrop{
  position:fixed;inset:0;z-index:60;background:rgba(107,74,94,.35);backdrop-filter:blur(3px);
  display:none;align-items:center;justify-content:center;padding:20px;
}
.modal-backdrop.show{display:flex}
.modal-card{
  background:#fff;border-radius:28px;padding:24px 26px;width:min(88vw,340px);
  text-align:center;box-shadow:0 14px 40px rgba(107,74,94,.3);
  animation:cardIn .45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes cardIn{from{transform:scale(.6) translateY(20px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
.modal-card .m-egg{width:96px;height:96px;border-radius:50%;background:#fff;padding:4px;margin:0 auto 10px;box-shadow:0 6px 16px rgba(255,107,169,.3);animation:eggBob 2.6s ease-in-out infinite}
.modal-card .m-egg img{width:100%;height:100%;border-radius:50%;object-fit:cover}
.modal-card h2{font-size:24px;color:var(--pink-deep);margin-bottom:6px;letter-spacing:2px}
.modal-card .m-info{font-size:14px;color:var(--ink-soft);line-height:1.9;margin-bottom:14px}
.vip-card{text-align:center}
.vip-crown{margin:0 auto 10px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#fff3d6,#ffe2a8);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(255,190,80,.45)}
.vip-crown svg{width:34px;height:34px}
.vip-tip{font-size:13px;color:#b58a5c;line-height:1.8;margin:6px 0 4px}
.vip-code{margin:14px auto 8px}
.vip-code input{width:210px;padding:11px 14px;border-radius:14px;border:2px solid #ffd7a8;background:#fffdf7;font-size:16px;text-align:center;outline:none;color:#8a5a2b}
.vip-code input:focus{border-color:#ffb45e;box-shadow:0 0 0 3px rgba(255,180,94,.25)}
.modal-card .m-info b{color:var(--pink-deep);font-family:var(--font-num)}
.modal-card .m-btns{display:flex;gap:10px;justify-content:center}
.btn-next{background:linear-gradient(135deg,#ff8fc8,#ff6ba9);box-shadow:0 4px 0 #e34a87,0 6px 12px rgba(255,107,169,.4);padding:9px 20px;font-size:16px}
.btn-retry{background:linear-gradient(135deg,#b39bff,#9679f0);box-shadow:0 4px 0 #7c5fdd,0 6px 12px rgba(150,121,240,.4);padding:9px 20px;font-size:16px}
/* ---------- Toast ---------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:#fff;color:var(--pink-deep);font-size:14px;padding:9px 20px;border-radius:999px;
  box-shadow:0 6px 18px rgba(255,107,169,.3),inset 0 0 0 2px #ffe9f3;
  opacity:0;transition:all .3s;pointer-events:none;z-index:70;white-space:nowrap;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* ---------- 响应式 ---------- */
@media (max-width:520px){
  .stat-card .v{font-size:18px}
  .egg-badge{width:72px;height:72px}
  .egg-bubble{font-size:15px;padding:6px 10px}
  .board-wrap{width:94vw;padding:7px}
}
@media (prefers-reduced-motion:reduce){
  .bg-decor .cloud,.bg-decor .tw,.title-row .bow-icon,.h1.title,.level-badge,.over-egg,.over-egg .thought{animation:none}
  .piece .sticker,.piece.selected .sticker{transition:none}
}
</style>
</head>
<body>
<!-- ===== 背景漂浮装饰 ===== -->
<div class="bg-decor" aria-hidden="true">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <span class="tw" style="top:6%;left:8%"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.4L20 8l-4.2 3.9L17 18l-5-3-5 3 1.2-6.1L4 8l5.6-.6z" fill="#ffd23f"/></svg></span>

  <span class="tw tw3" style="top:34%;left:3%"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C1 8.4 3.6 5 7 5c2 0 3.6 1.2 5 3 1.4-1.8 3-3 5-3 3.4 0 6 3.4 4.6 6.6C19.5 16.4 12 21 12 21z" fill="#b39bff"/></svg></span>
  <span class="tw" style="top:62%;left:90%"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.4L20 8l-4.2 3.9L17 18l-5-3-5 3 1.2-6.1L4 8l5.6-.6z" fill="#ffd23f"/></svg></span>
  <span class="tw tw2" style="top:84%;left:6%"><svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C1 8.4 3.6 5 7 5c2 0 3.6 1.2 5 3 1.4-1.8 3-3 5-3 3.4 0 6 3.4 4.6 6.6C19.5 16.4 12 21 12 21z" fill="#ff5c72"/></svg></span>
</div>

<!-- ===== 游戏外壳 ===== -->
<div class="game-shell">
  <!-- 标题 -->
  <div class="title-row">
    <svg class="bow-icon" viewBox="0 0 64 64">
      <path d="M20 18C8 12 4 22 10 28c6 5 16 3 18-4-2 9 4 20 16 22 10 1 18-6 12-15-3-5-9-7-14-5l4-6c-6-8-18-9-26-2z" fill="#ff8fc8" stroke="#e264a6" stroke-width="2.4" stroke-linejoin="round"/>
      <circle cx="33" cy="29" r="6" fill="#ff6ba9" stroke="#e264a6" stroke-width="2.4"/>
      <path d="M28 34l-6 12 10-6zM38 34l6 12-10-6z" fill="#ff9ec6" stroke="#e264a6" stroke-width="2.2" stroke-linejoin="round"/>
    </svg>
    <h1 class="title">甜甜消消乐 <span class="ver">2.0版</span></h1>
    <span class="level-badge" id="levelBadge">第 1 关</span>
  </div>

  <!-- 统计栏 -->
  <div class="stats-bar">
    <div class="stat-card score"><div class="k">分数</div><div class="v" id="scoreVal">0</div></div>
    <div class="stat-card moves"><div class="k">剩余步数</div><div class="v" id="movesVal">30</div></div>
    <div class="stat-card goal"><div class="k">目标分数</div><div class="v" id="goalVal">1500</div></div>
    <div class="stat-card time"><div class="k">剩余时间</div><div class="v" id="timeVal">3:00</div></div>
    <button class="icon-btn" id="muteBtn" title="声音开关" aria-label="声音开关">
      <svg id="iconSound" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#ff6ba9"/><path d="M15.5 8.5a5 5 0 010 7" stroke="#ff6ba9" stroke-width="2" fill="none" stroke-linecap="round"/><path d="M18 6a9 9 0 010 12" stroke="#ff6ba9" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
      <svg id="iconMuted" viewBox="0 0 24 24" style="display:none"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="#c9b8c4"/><path d="M16 9l5 6M21 9l-5 6" stroke="#c9b8c4" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- 目标进度 -->
  <div class="progress-wrap">
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="progress-star" id="progressStar">
      <svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.4L20 8l-4.2 3.9L17 18l-5-3-5 3 1.2-6.1L4 8l5.6-.6z" fill="#ffd23f" stroke="#e89a2e" stroke-width="1.4"/></svg>
    </div>
  </div>

  <!-- 连击指示 -->
  <div class="combo-badge" id="comboBadge">
    <svg class="heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C1 8.4 3.6 5 7 5c2 0 3.6 1.2 5 3 1.4-1.8 3-3 5-3 3.4 0 6 3.4 4.6 6.6C19.5 16.4 12 21 12 21z" fill="#fff"/></svg>
    <span id="comboText">连击 ×2</span>
  </div>

  <!-- 棋盘 -->
  <div class="board-wrap">
    <div id="board">
      <div class="cell-mask"></div>
    </div>
    <!-- 蛋小黄弹出层 -->
    <div id="egg-pop"></div>
    <!-- 特效层 -->
    <div id="fx-layer"></div>
  </div>

  <!-- 操作区 -->
  <div class="action-bar">
    <div class="btn-row">
      <button class="btn btn-hint" id="hintBtn">
        <svg viewBox="0 0 24 24"><path d="M9 18h6v-1H9v1zm1-3h4l-.5-4.2L13 4h-2l-.5 6.8L10 15zM12 1a11 11 0 00-4 21v2h8v-2A11 11 0 0012 1z" fill="#fff"/></svg>
        <span class="b-txt">提示 ×<b id="hintTxt">2</b></span>
      </button>
      <button class="btn btn-shuffle" id="shuffleBtn">
        <svg viewBox="0 0 24 24"><path d="M17 3l4 4-4 4M21 7H9a5 5 0 000 10h2M7 7H3l4-4M7 7H3M7 17h2a5 5 0 005-5" stroke="#fff" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="b-txt">洗牌 ×<b id="shuffleTxt">2</b></span>
      </button>
      <button class="btn btn-restart" id="restartBtn">
        <svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a6 6 0 11-6 6H4a8 8 0 108-8z" fill="#fff"/></svg>
        重开本关
      </button>
      <button class="btn btn-home" id="homeBtn">
        <svg viewBox="0 0 24 24"><path d="M12 3l9 8h-3v9h-5v-6h-2v6H6v-9H3z" fill="#fff"/></svg>
        回到主页
      </button>
    </div>
    <div class="tip-text">点击两个相邻的可爱图案交换位置，上下左右相邻的相同图案达到 3 个及以上，就会一鼓作气全部消除！连消会蹦出蛋小黄给你加油哦</div>
  </div>
</div>

}

/* ============================================================
   三、匹配检测（十字规则） / 消除 / 重力 / 补充
   规则：以任一图案为中心，其上下左右 4 个邻居中同色图案
   连同中心一起计数，达到 3 个及以上时，这一整团全部消除。
   ============================================================ */
function findMatches(){
  var groups=[];
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var cur=grid[r][c];
    if(!cur)continue;
    var cells=[{r:r,c:c}];
    if(r>0&&grid[r-1][c]&&grid[r-1][c].type===cur.type)cells.push({r:r-1,c:c});
    if(r<ROWS-1&&grid[r+1][c]&&grid[r+1][c].type===cur.type)cells.push({r:r+1,c:c});
    if(c>0&&grid[r][c-1]&&grid[r][c-1].type===cur.type)cells.push({r:r,c:c-1});
    if(c<COLS-1&&grid[r][c+1]&&grid[r][c+1].type===cur.type)cells.push({r:r,c:c+1});
    if(cells.length>=3)groups.push(cells);
  }
  return groups;
}
function swapRefs(a,b){
  var ar=a.r,ac=a.c,br=b.r,bc=b.c;
  var pa=grid[ar][ac],pb=grid[br][bc];
  grid[ar][ac]=pb;grid[br][bc]=pa;
  if(pa){pa.r=br;pa.c=bc;}
  if(pb){pb.r=ar;pb.c=ac;}
}
function wouldMatch(a,b){
  swapRefs(a,b);
  var ok=findMatches().length>0;
  swapRefs(a,b);
  return ok;
}
function existsValidMove(){
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(c<COLS-1&&wouldMatch({r:r,c:c},{r:r,c:c+1}))return true;
    if(r<ROWS-1&&wouldMatch({r:r,c:c},{r:r+1,c:c}))return true;
  }
  return false;
}
function applyGravity(){
  var moves=[];
  for(var c=0;c<COLS;c++){
    var w=ROWS-1;
    for(var r=ROWS-1;r>=0;r--){
      if(grid[r][c]){
        if(w!==r){grid[w][c]=grid[r][c];grid[r][c]=null;grid[w][c].r=w;grid[w][c].c=c;moves.push(grid[w][c]);}
        w--;
      }
    }
  }
  return moves;
}
function refill(){
  for(var c=0;c<COLS;c++){
    var n=0;
    for(var r=0;r<ROWS;r++)if(!grid[r][c])n++;
    for(var i=0;i<n;i++){
      var t=Math.floor(Math.random()*TYPES);
      var id='p'+(nextId++);
      var el=makeEl(t,id);
      pieceEls[id]=el;
      grid[i][c]={id:id,type:t,r:i,c:c};
      boardEl.appendChild(el);
      el.style.width=cell+'px';el.style.height=cell+'px';
      el.style.transform=pos(-(n-i),c);
      el.classList.add('anim');
      el.style.transitionDelay=(c*12+i*10)+'ms';
      setEl(el,i,c);
      setTimeout(function(el){el.style.transitionDelay='0ms';},600,el);
    }
  }
}

/* ============================================================
   七、消除主流程
   ============================================================ */
function wait(ms){return new Promise(function(ok){setTimeout(ok,ms);});}
function cellOf(id){
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)
    if(grid[r][c]&&grid[r][c].id===id)return grid[r][c];
  return null;
}
function adjacent(a,b){return Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;}
function showCombo(w){
  document.getElementById('comboText').textContent='连击 ×'+w;
  var b=document.getElementById('comboBadge');
  b.classList.add('show');
  b.style.animation='none';void b.offsetWidth;b.style.animation='';
}
function hideCombo(){document.getElementById('comboBadge').classList.remove('show');}

async function resolveCascade(){
  var wave=0,maxGroup=1,lastR=ROWS-1,lastC=0;
  while(true){
    var groups=findMatches();
    if(!groups.length)break;
    wave++;
    var cells=[],groupMax=0;
    groups.forEach(function(g){if(g.length>groupMax)groupMax=g.length;cells=cells.concat(g);});
    var seen={},uniq=[];
    cells.forEach(function(cl){var k=cl.r+','+cl.c;if(!seen[k]){seen[k]=1;uniq.push(cl);}});
    maxGroup=Math.max(maxGroup,groupMax);
    var sumR=0,sumC=0;
    uniq.forEach(function(cl){
      var id=grid[cl.r][cl.c].id,el=pieceEls[id];
      if(el)el.classList.add('popping');
      burst(4,(cl.c+.5)*cell,(cl.r+.5)*cell);
      sumR+=cl.r;sumC+=cl.c;
    });
    var pts=uniq.length*10*wave;
    groups.forEach(function(g){if(g.length>=4)pts+=(g.length>=5?50:20);});
    score+=pts;
    addFloat((sumC/uniq.length+.5)*cell,(sumR/uniq.length)*cell,'+'+pts);
    sMatch(wave);
    lastR=uniq[uniq.length-1].r;lastC=uniq[uniq.length-1].c;
    /* —— 并行补位：弹出动画与下落、补充同步进行，不留空窗 ——
          1) 消除格播放 300ms 缩小消失动画，动画播完才移除 DOM；
          2) 同一时刻上方方块立即下落、顶部新方块补充，
             恰好接上消除格消失的瞬间，棋盘任何时刻都不会留下空格 */
    uniq.forEach(function(cl){
      var id=grid[cl.r][cl.c].id,el=pieceEls[id];
      if(el){el.classList.add('popping');setTimeout(function(){removeEl(id);},300);}
    });
    uniq.forEach(function(cl){grid[cl.r][cl.c]=null;});
    var gs=applyGravity();
    gs.forEach(function(p){var el=pieceEls[p.id];if(el){el.classList.add('anim');setEl(el,p.r,p.c);}});
    sFall();
    refill();
    await wait(460);
  }
  updateUI();
  return {wave:wave,maxRun:maxGroup,lastR:lastR,lastC:lastC};
}

async function doSwap(a,b){
  if(busy||!a||!b)return;
  busy=true;clearHint();
  var elA=pieceEls[a.id],elB=pieceEls[b.id];
  elA.classList.add('anim-swap');elB.classList.add('anim-swap');
  swapRefs(a,b);
  setEl(elA,a.r,a.c);setEl(elB,b.r,b.c);
  sSelect();
  await wait(180);
  elA.classList.remove('anim-swap');elB.classList.remove('anim-swap');
  if(findMatches().length===0){
    elA.classList.add('anim-swap');elB.classList.add('anim-swap');
    swapRefs(a,b);
    setEl(elA,a.r,a.c);setEl(elB,b.r,b.c);
    await wait(180);
    elA.classList.remove('anim-swap');elB.classList.remove('anim-swap');
    busy=false;
    return;
  }
  moves--;combo=0;hideCombo();updateUI();
  var res=await resolveCascade();
  if(res.wave>=2||res.maxRun>=4){
    showCombo(res.wave);
    eggPopAt(res.lastR,res.lastC,res.wave,res.maxRun);
  }
  await wait(320);
  busy=false;
  if(score>=target){finishLevel(true);return;}
  if(moves<=0){finishLevel(false);return;}
  if(!existsValidMove()){autoShuffle();}
}

/* ============================================================
   八、选择 / 滑动交换
   ============================================================ */
var selected=null,ptr=null;
function setSelected(p){
  if(selected&&pieceEls[selected.id])pieceEls[selected.id].classList.remove('selected');
  selected=p;
  if(p&&pieceEls[p.id])pieceEls[p.id].classList.add('selected');
}
function deselect(){
  if(selected&&pieceEls[selected.id])pieceEls[selected.id].classList.remove('selected');
  selected=null;
}
boardEl.addEventListener('pointerdown',function(e){
  var el=e.target.closest('.piece');
  if(!el||busy)return;
  ptr={id:el.dataset.id,x:e.clientX,y:e.clientY,moved:false};
  if(el.setPointerCapture)el.setPointerCapture(e.pointerId);
});
boardEl.addEventListener('pointermove',function(e){
  if(!ptr||busy)return;
  var dx=e.clientX-ptr.x,dy=e.clientY-ptr.y;
  if(!ptr.moved&&Math.abs(dx)+Math.abs(dy)>24){
    ptr.moved=true;
    var p=cellOf(ptr.id);if(!p)return;
    var nr=p.r,nc=p.c;
    if(Math.abs(dx)>Math.abs(dy))nc=p.c+(dx>0?1:-1);else nr=p.r+(dy>0?1:-1);
    if(nr>=0&&nr<ROWS&&nc>=0&&nc<COLS){
      deselect();
      doSwap(p,grid[nr][nc]);
    }
  }
});
boardEl.addEventListener('pointerup',function(e){
  if(!ptr)return;
  var wasMove=ptr.moved;ptr=null;
  if(wasMove||busy)return;
  var el=e.target.closest('.piece');
  if(!el)return;
  var p=cellOf(el.dataset.id);if(!p)return;
  if(selected){
    if(p.id===selected.id){deselect();return;}
    if(adjacent(selected,p)){deselect();doSwap(selected,p);}
    else setSelected(p);
  }else setSelected(p);
});

   九、提示 / 洗牌 / 重开 / 关卡

var hintTimer=null,hintBusy=false;
function clearHint(){
  if(hintTimer){clearTimeout(hintTimer);hintTimer=null;}
  hintBusy=false;
  document.querySelectorAll('.piece.hint').forEach(function(el){el.classList.remove('hint');});
}
function findHint(){
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    if(c<COLS-1&&wouldMatch({r:r,c:c},{r:r,c:c+1}))return [{r:r,c:c},{r:r,c:c+1}];
    if(r<ROWS-1&&wouldMatch({r:r,c:c},{r:r+1,c:c}))return [{r:r,c:c},{r:r+1,c:c}];
  }
  return null;
}
function doHint(){
  if(busy){toast('等一下下，方块还在动哦～');return;}
  if(hintBusy){toast('提示冷却中，稍等一下下哦～');return;}
  if(hintChances<=0){showAdConfirm('提示次数用完啦～<br>需要看一段广告哦~<br>观看 <b>30 秒</b> 可获得 <b>3 次</b> 提示','hint',0);return;}
  hintBusy=true;
  try{
    var h=findHint();
    if(!h){toast('没有可消除的啦，洗个牌吧～');hintBusy=false;return;}
    h.forEach(function(p){
      var cell=grid[p.r][p.c];
      if(cell&&pieceEls[cell.id])pieceEls[cell.id].classList.add('hint');
    });
    sSelect();
    hintChances=Math.max(0,hintChances-1);saveChances();updateChanceBtns();
    hintTimer=setTimeout(function(){clearHint();hintBusy=false;},1500);
  }catch(e){
    hintBusy=false;
  }
}
function autoShuffle(){
  toast('没有可消除的啦，洗个牌～');
  sShuffle();
  var guard=0;
  do{clearBoard();buildBoard();guard++;}
  while(!existsValidMove()&&guard<30);
  deselect();updateUI();
}
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(function(){t.classList.remove('show');},1800);
}
var toastTimer=null;

var TIME_LIMIT=180,timeLeft=TIME_LIMIT,timerId=null;
function fmtTime(s){var m=Math.floor(s/60),ss=s%60;return m+':'+(ss<10?'0'+ss:ss);}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;}}
function startTimer(from){
  stopTimer();
  if(from!==undefined)timeLeft=from;else timeLeft=TIME_LIMIT;
  var tv=document.getElementById('timeVal');
  tv.textContent=fmtTime(timeLeft);
  tv.parentNode.classList.remove('time-low');
  timerId=setInterval(function(){
    timeLeft--;
    if(timeLeft<0){stopTimer();timeLeft=0;finishLevel(false);return;}
    tv.textContent=fmtTime(timeLeft);
    if(timeLeft<=30)tv.parentNode.classList.add('time-low');
  },1000);
}
function saveChances(){try{localStorage.setItem('ttx-chances',JSON.stringify({h:hintChances,s:shuffleChances}));}catch(e){}}

  document.getElementById('hintTxt').textContent=hintChances;

  var track=document.querySelector('.progress-track'),tw=track.clientWidth;
  var sl=Math.max(0,Math.min(tw-26,tw*p/100-13));

function finishLevel(win){
  stopTimer();busy=false;
  var best=bestByLevel[level]||0;
  if(score>best){bestByLevel[level]=score;localStorage.setItem('ttx-best',JSON.stringify(bestByLevel));}
  var st=0,secs=0;
  if(win){
    secs=TIME_LIMIT-timeLeft;
    st=secs<=60?3:(secs<=120?2:1);
    if((starsByLevel[level]||0)<st){starsByLevel[level]=st;localStorage.setItem('ttx-stars',JSON.stringify(starsByLevel));}
    hintChances=Math.min(3,hintChances+1);shuffleChances=Math.min(3,shuffleChances+1);saveChances();updateChanceBtns();
  }
  var stars='';
  for(var i=1;i<=3;i++)stars+='<span class="st'+(win&&i<=st?' on':'')+'"><svg viewBox="0 0 24 24"><path d="M12 2l2.4 5.4L20 8l-4.2 3.9L17 18l-5-3-5 3 1.2-6.1L4 8l5.6-.6z" fill="'+(win&&i<=st?'#ffd23f':'#e3d5dd')+'"/></svg></span>';
  document.getElementById('starRow').innerHTML=stars;
  document.getElementById('modalTitle').textContent=win?'过关啦！':'再试一次吧~';
  document.getElementById('modalInfo').innerHTML=win
    ?'本关得分 <b>'+score+'</b> ／ 目标 '+target+'<br>用时 '+fmtTime(secs)+' · 获得 <b>'+st+'</b> 颗星 · 历史最佳 <b>'+best+'</b>'
    :'本关得分 <b>'+score+'</b> ／ 目标 '+target+'<br>历史最佳 <b>'+best+'</b> · 蛋小黄陪你加油！';
  document.getElementById('modalNext').style.display=win?'inline-flex':'none';
  document.getElementById('modalContinue').style.display=win?'none':'inline-flex';
  document.getElementById('modal').classList.toggle('fail-mode',!win);
  document.getElementById('modal').classList.add('show');
  win?sWin():sLose();
}

    ld.innerHTML='<div class="ad-spinner"></div><span>视频加载中~</span>';
  }
  var done=false;
  nf.addEventListener('load',function(){
    done=true;
    if(ld)ld.classList.remove('show');
  });
  clearTimeout(adLoadTimer);
  adLoadTimer=setTimeout(function(){
    if(!done&&ld){
      ld.classList.add('fail');
      ld.innerHTML='<div class="ad-reload-icon">↻</div><span>视频加载失败，点我重新加载</span>';
    }
  },8000);
}
function adReload(){
  var f=document.getElementById('adFrame');
  if(f)f.remove();
  ensureAdFrame();
}
function startAd(){
  closeAdConfirm();
  ensureAdFrame();
  document.getElementById('adModal').classList.add('show');
  adLeft=AD_SECONDS;
  document.getElementById('adGo').disabled=true;
  updateAdUI();
  adTimer=setInterval(adTick,1000);
}
document.addEventListener('visibilitychange',function(){
  var adShow=document.getElementById('adModal').classList.contains('show');
  if(!adShow)return;
  if(document.hidden){
    if(adTimer){clearInterval(adTimer);adTimer=null;}
    var f=document.getElementById('adFrame');
    if(f)f.remove();
    document.getElementById('adGo').disabled=true;
  }else{
    if(adTimer===null&&adLeft>0){
      ensureAdFrame();
      adTimer=setInterval(adTick,1000);
    }
    if(adLeft<=0){
      document.getElementById('adGo').disabled=false;
      document.getElementById('adCount').textContent='可以继续啦！';
      document.getElementById('adFill').style.width='100%';
    }
  }
});
function grantAdReward(p){
  if(!p)return;
  if(p.type==='level'){
    if(p.n>unlockedExtra){unlockedExtra=p.n;localStorage.setItem('ttx-unlocked',unlockedExtra);}
    toast('第 '+p.n+' 关已解锁！');
    openLevels();
  }else if(p.type==='hint'){
    hintChances=Math.min(3,hintChances+3);saveChances();updateChanceBtns();
    toast('获得 3 次提示～');
  }else if(p.type==='shuffle'){
    shuffleChances=Math.min(3,shuffleChances+3);saveChances();updateChanceBtns();
    toast('获得 3 次洗牌～');
  }else if(p.type==='time'){
    timeLeft+=120;
    if(moves<=0)moves=10;
    document.getElementById('modal').classList.remove('show');
    busy=false;
    updateUI();
    startTimer(timeLeft);
    toast('继续加油！时间 +2 分钟～');
  }
}
function finishAd(){
  document.getElementById('adModal').classList.remove('show');
  var f=document.getElementById('adFrame');
  if(f)f.remove();
  var p=adPending;adPending=null;
  grantAdReward(p);
}
function goHome(){
  stopTimer();
  if(busy)return;
  deselect();clearHint();
  document.getElementById('modal').classList.remove('show');
  document.getElementById('levelModal').classList.remove('show');
  document.getElementById('startOverlay').classList.remove('hide');
}

/* ============================================================
   十、按钮与初始化
   ============================================================ */
document.getElementById('hintBtn').addEventListener('click',doHint);
document.getElementById('shuffleBtn').addEventListener('click',function(){
  if(busy){toast('等一下下，方块还在动哦～');return;}
  if(shuffleChances<=0){showAdConfirm('洗牌次数用完啦～<br>需要看一段广告哦~<br>观看 <b>30 秒</b> 可获得 <b>3 次</b> 洗牌','shuffle',0);return;}
  shuffleChances=Math.max(0,shuffleChances-1);saveChances();updateChanceBtns();
  deselect();clearHint();autoShuffle();
});
document.getElementById('restartBtn').addEventListener('click',function(){
  if(busy)return;
  document.getElementById('modal').classList.remove('show');
  restartLevel();toast('重新开始啦，加油！');
});
document.getElementById('playBtn').addEventListener('click',startGame);
document.getElementById('homeBtn').addEventListener('click',goHome);
document.getElementById('levelsBtn').addEventListener('click',openLevels);
document.getElementById('levelClose').addEventListener('click',function(){
  document.getElementById('levelModal').classList.remove('show');
});
document.getElementById('levelGrid').addEventListener('click',function(e){
  var b=e.target.closest('.level-btn');
  if(!b)return;
  var n=parseInt(b.dataset.level,10);
  if(b.classList.contains('locked')){
    showAdConfirm('要解锁吗，需要看一段广告哦~<br>观看 <b>30 秒</b> 即可解锁第 <b>'+n+'</b> 关','level',n);
    return;
  }
  goToLevel(n);
});
document.getElementById('modalNext').addEventListener('click',function(){
  document.getElementById('modal').classList.remove('show');
  nextLevel();toast('进入第 '+level+' 关！');
});
document.getElementById('modalRetry').addEventListener('click',function(){
  document.getElementById('modal').classList.remove('show');
  restartLevel();
});document.getElementById('modalContinue').addEventListener('click',function(){
  showAdConfirm('还要继续玩吗？<br>需要看一段广告哦~<br>观看 <b>30 秒</b> 可增加 <b>2 分钟</b> 时间','time',0);
});
document.getElementById('adOk').addEventListener('click',startAd);
document.getElementById('adCancel').addEventListener('click',closeAdConfirm);
document.getElementById('adGo').addEventListener('click',finishAd);
document.getElementById('adLoading').addEventListener('click',adReload);
document.getElementById('vipBtn').addEventListener('click',function(){
  if(isVip){toast('您已是尊贵 VIP 啦～');return;}
  document.getElementById('vipCode').value='';
  document.getElementById('vipModal').classList.add('show');
  document.getElementById('vipCode').focus();
});
document.getElementById('vipOk').addEventListener('click',function(){
  var v=document.getElementById('vipCode').value.trim();
  if(_chk(v)){
    isVip=true;
    try{localStorage.setItem('ttx-vip','1');}catch(e){}
    document.getElementById('vipModal').classList.remove('show');
    updateVipUI();
    toast('恭喜！VIP 身份激活成功～');
  }else{
    toast('激活码不对哦，再试试~');
  }
});
document.getElementById('vipCancel').addEventListener('click',function(){
  document.getElementById('vipModal').classList.remove('show');
});
document.getElementById('vipCode').addEventListener('keydown',function(e){
  if(e.key==='Enter')document.getElementById('vipOk').click();
});
document.getElementById('muteBtn').addEventListener('click',function(){
  muted=!muted;
  localStorage.setItem('ttx-muted',muted?'1':'0');
  document.getElementById('iconSound').style.display=muted?'none':'';
  document.getElementById('iconMuted').style.display=muted?'':'none';
  if(!muted){ac();tone(700,.08,'triangle',.08);}
});
function applyMuteIcon(){
  document.getElementById('iconSound').style.display=muted?'none':'';
  document.getElementById('iconMuted').style.display=muted?'':'none';
}
window.addEventListener('resize',function(){
  cell=cellPx();
  boardEl.style.setProperty('--cell',cell+'px');
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++){
    var p=grid[r][c];if(p&&pieceEls[p.id])setEl(pieceEls[p.id],r,c);
  }
});
/* 初始化 */
function init(){
  cell=cellPx();
  boardEl.style.setProperty('--cell',cell+'px');
  updateVipUI();
  buildBoard();
  updateUI();
  applyMuteIcon();
  hideCombo();
  updateChanceBtns();
  document.getElementById('timeVal').textContent=fmtTime(TIME_LIMIT);
}
init();
</script>
